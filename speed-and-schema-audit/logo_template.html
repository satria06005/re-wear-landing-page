<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    width: 512px;
    height: 512px;
    background: #111827;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #ffffff;
  }
  .box {
    border: 3px solid #DDD7CB;
    padding: 36px 44px;
    border-radius: 12px;
    text-align: center;
    background: #1A2E22;
  }
  .title {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -1.5px;
    color: #FAF8F5;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #DDD7CB;
  }
  .dot {
    color: #9A462B;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="title">RE—WEAR<span class="dot">.</span></div>
    <div class="subtitle">Curated Vintage Apparel</div>
  </div>
</body>
</html>
